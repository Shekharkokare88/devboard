#Goal: To deploy the built images from CI Steps once the CI Workflows is succeeded
name: CD 
on:
    workflow_call:
    #workflow_run:
     
     #   workflows: ['Validate']
      #        types: [completed]
       # branches:
        #    - 'advanced'
jobs:
    deploy:
        runs-on: self-hosted
        steps: 
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Copy Example Env to main Env
              run: cp .env.example .env

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Deploy the container with Docker Compose
              run: |
                docker compose pull
                docker compose up -d
     
